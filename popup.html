<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 320px; padding: 16px; font-family: system-ui, sans-serif; background: #f7f7f7; margin: 0; }
        h4 { margin: 0 0 10px 0; font-size: 15px; color: #333; }
        .halloween-banner {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 12px; margin-bottom: 14px;
            background: linear-gradient(135deg, #2c1246, #180a2b);
            border: 1px solid #6d28d9; border-radius: 10px;
            box-shadow: 0 0 18px rgba(255, 140, 26, .25);
        }
        .halloween-banner .hb-text { font-size: 14px; font-weight: bold; color: #ffc078; }
        .halloween-banner .hb-sub { font-size: 11px; color: #c4a6e6; margin-top: 2px; }
        .halloween-banner .hb-left { display: flex; align-items: center; gap: 8px; }
        .input-group { display: flex; gap: 6px; margin-bottom: 8px; }
        input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; box-sizing: border-box; }
        button { padding: 8px 12px; background: #4F46E5; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #4338ca; }
        .btn-clear { background: #ef4444; }
        
        .switch-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 12px; padding: 10px; background: #fff; border-radius: 8px; border: 1px solid #eee;
        }
        .halloween-banner .switch { margin-left: 4px; }
        #halloweenToggle:checked + .slider:before { transform: translateX(20px); }
        .switch-text { font-size: 13px; font-weight: bold; color: #333; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #4F46E5; }
        input:checked + .slider:before { transform: translateX(18px); }

        .cursor-section { margin-top: 12px; padding: 10px; background: #fff; border-radius: 8px; border: 1px solid #eee; }
        .cursor-section label { font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 8px; }
        select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; box-sizing: border-box; }

        .upload-area { display: none; margin-top: 8px; padding: 12px; border: 1px dashed #4F46E5; border-radius: 6px; text-align: center; background: #f9f8ff; }
        .upload-area button { font-size: 12px; padding: 6px 12px; background: #8b5cf6; }
        .preview-box { margin-top: 8px; font-size: 12px; color: #666; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .preview-box img { width: 32px; height: 32px; border-radius: 4px; }

        #msg { font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; color: #16a34a; font-weight: bold; }
    </style>
</head>
<body>
    <div class="halloween-banner">
        <div class="hb-left">
            <span style="font-size:22px;">🎃</span>
            <div>
                <div class="hb-text">万圣节主题</div>
                <div class="hb-sub">Trick or Treat · 不给糖就捣蛋</div>
            </div>
        </div>
        <label class="switch" style="width:44px; height:24px;">
            <input type="checkbox" id="halloweenToggle" checked>
            <span class="slider" style="width:44px; height:24px;"></span>
        </label>
    </div>

    <h4>🖼️ 自定义背景图</h4>
    <div class="input-group">
        <input type="text" id="bgInput" placeholder="粘贴图片直链..." />
        <button id="saveBtn">💾 保存</button>
    </div>
    <button id="clearBtn" class="btn-clear" style="width:100%;">🗑️ 恢复默认背景</button>

    <div class="switch-row">
        <div class="switch-text">开启背景遮罩</div>
        <label class="switch">
            <input type="checkbox" id="maskToggle" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="cursor-section">
        <label>🖱️ 鼠标指针风格</label>
        <select id="cursorSelect">
            <option value="default">系统默认指针</option>
            <option value="style1">款式 1 (单箭头)</option>
            <option value="style2">款式 2 (单箭头)</option>
            <option value="style3">款式 3 (单箭头)</option>
            <option value="style6">款式 6 (万圣限定)</option>
            <option value="custom">✨ 自定义上传 (单箭头)</option>
        </select>

        <div id="customCursorArea" class="upload-area">
            <input type="file" id="customCursorFile" accept="image/png" style="display: none;">
            <button id="uploadCursorBtn">📁 选择本地图片 (.png)</button>
            <div id="cursorPreview" class="preview-box">未选择图片</div>
        </div>
    </div>

    <div id="msg"></div>
    <script src="popup.js"></script>
</body>
</html>
